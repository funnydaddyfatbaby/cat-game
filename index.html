<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>喵游记 · Cat Go</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1220; --panel:#1a1f35; --panel2:#232a47; --line:#2e3760;
    --txt:#eef1ff; --sub:#9aa3c7; --accent:#ffb454; --accent2:#7c8cff;
    --good:#5fd38d; --bad:#ff6b8a; --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* 顶部状态条 */
  #topbar{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:linear-gradient(180deg,rgba(15,18,32,.92),rgba(15,18,32,0));pointer-events:none;}
  #topbar .brand{font-weight:800;font-size:18px;letter-spacing:.5px;pointer-events:auto;}
  #topbar .brand small{color:var(--accent);}
  #topbar .spacer{flex:1;}
  .pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--sub);}
  .pill b{color:var(--txt);}

  /* 地图 */
  #map{flex:1;background:#10131f;z-index:1;}
  .leaflet-container{background:#10131f;}
  /* 暗色滤镜让地图更有夜行猫感 */
  .leaflet-tile{filter:grayscale(.3) brightness(.78) contrast(1.05) hue-rotate(-8deg);}

  /* 猫 marker */
  .cat-marker{font-size:30px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
    animation:bob 2.2s ease-in-out infinite;cursor:pointer;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .me-marker{width:18px;height:18px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 0 6px rgba(124,140,255,.25),0 0 0 12px rgba(124,140,255,.12);}

  /* 底部操作栏 */
  #dock{position:absolute;bottom:0;left:0;right:0;z-index:1000;display:flex;gap:10px;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(15,18,32,.95),rgba(15,18,32,0));}
  .dock-btn{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 8px;text-align:center;font-size:13px;color:var(--sub);cursor:pointer;transition:.15s;}
  .dock-btn:active{transform:scale(.96);}
  .dock-btn .ico{font-size:22px;display:block;margin-bottom:2px;}
  .dock-btn.primary{background:linear-gradient(135deg,var(--accent),#ff8e53);color:#1a1206;border:none;font-weight:700;}

  /* 通用面板/弹层 */
  .sheet-mask{position:fixed;inset:0;z-index:2000;background:rgba(5,7,15,.6);backdrop-filter:blur(4px);
    display:none;align-items:flex-end;justify-content:center;}
  .sheet-mask.show{display:flex;}
  .sheet{width:100%;max-width:520px;background:var(--panel);border-radius:22px 22px 0 0;
    border-top:1px solid var(--line);padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:.28s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow:auto;}
  .sheet-mask.show .sheet{transform:translateY(0);}
  .sheet h2{margin:0 0 4px;font-size:20px;}
  .sheet .muted{color:var(--sub);font-size:13px;}
  .grabber{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px;}

  /* 猫咪详情卡 */
  .cat-hero{display:flex;gap:14px;align-items:center;margin:6px 0 14px;}
  .cat-emoji{font-size:54px;line-height:1;width:78px;height:78px;display:flex;align-items:center;justify-content:center;
    background:var(--panel2);border-radius:18px;flex:0 0 auto;}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--line);color:var(--sub);margin:2px 4px 0 0;}
  .tag.rare{color:var(--accent);border-color:#5a4720;background:#2a2210;}

  .stat{margin:10px 0;}
  .stat .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px;}
  .bar{height:9px;border-radius:9px;background:var(--panel2);overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:9px;transition:width .4s;}
  .bar.affection>i{background:linear-gradient(90deg,#ff6b8a,#ffb454);}
  .bar.mood>i{background:linear-gradient(90deg,#7c8cff,#5fd38d);}
  .bar.alert>i{background:linear-gradient(90deg,#5fd38d,#ff6b8a);}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .act{padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);
    text-align:center;font-size:15px;cursor:pointer;transition:.15s;font-weight:600;}
  .act:active{transform:scale(.97);}
  .act.adopt{grid-column:1/3;background:linear-gradient(135deg,var(--good),#3aa971);color:#06150d;border:none;}
  .act.adopt:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;}

  .speech{margin-top:14px;background:var(--panel2);border-radius:14px;padding:12px 14px;font-size:14px;
    min-height:46px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);}
  .speech .react{font-size:22px;}

  /* 图鉴 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  .pet{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
  .pet .e{font-size:38px;}
  .pet .n{font-size:13px;font-weight:700;margin-top:4px;}
  .pet .p{font-size:11px;color:var(--sub);}
  .empty{color:var(--sub);text-align:center;padding:30px 0;font-size:14px;}

  /* 开场 */
  #intro{position:fixed;inset:0;z-index:3000;background:radial-gradient(120% 80% at 50% 0%,#202747,#0f1220);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
  #intro .logo{font-size:72px;margin-bottom:6px;}
  #intro h1{margin:0;font-size:30px;}
  #intro p{color:var(--sub);max-width:340px;line-height:1.6;}
  .cta{margin-top:20px;background:linear-gradient(135deg,var(--accent),#ff8e53);color:#1a1206;
    border:none;border-radius:14px;padding:15px 34px;font-size:17px;font-weight:800;cursor:pointer;}
  .cta:active{transform:scale(.97);}
  #intro .hint{font-size:12px;margin-top:14px;}

  /* 拍照 */
  .photo-card{position:relative;background:#fff;color:#222;border-radius:16px;padding:14px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .photo-card .frame{background:linear-gradient(135deg,#ffe9c7,#ffd1dc);border-radius:12px;padding:26px 0;font-size:90px;}
  .photo-card .cap{font-weight:800;margin-top:10px;font-size:16px;}
  .photo-card .sub{color:#888;font-size:12px;}

  /* 喜好线索 */
  .hint-chip{margin-top:10px;background:#2a2210;border:1px solid #5a4720;color:var(--accent);
    border-radius:12px;padding:9px 12px;font-size:13px;display:flex;align-items:center;gap:6px;}

  /* 道具选择器 */
  .picker-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .item-row{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;cursor:pointer;transition:.15s;}
  .item-row:active{transform:scale(.98);}
  .item-row.disabled{opacity:.4;pointer-events:none;}
  .item-row .ie{font-size:30px;width:42px;text-align:center;flex:0 0 auto;}
  .item-row .info{flex:1;min-width:0;}
  .item-row .iname{font-weight:700;font-size:15px;}
  .item-row .idesc{font-size:12px;color:var(--sub);margin-top:1px;}
  .item-row .cnt{font-size:13px;color:var(--sub);flex:0 0 auto;}
  .aff-badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;margin-left:6px;}
  .aff-love{background:#1d3a26;color:var(--good);}
  .aff-hate{background:#3a1d28;color:var(--bad);}
  .aff-mid{background:var(--panel);color:var(--sub);}

  /* 背包格子（猫窝里） */
  .bag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .bag .slot{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;position:relative;}
  .bag .slot .be{font-size:26px;}
  .bag .slot .bn{font-size:10px;color:var(--sub);margin-top:2px;}
  .bag .slot .bc{position:absolute;top:4px;right:6px;font-size:11px;font-weight:800;color:var(--accent);}
  .sec-title{font-size:13px;color:var(--sub);margin:16px 0 0;font-weight:700;}

  /* toast */
  #toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);z-index:4000;
    background:#000c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;
    opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">喵<small>游记</small></div>
    <div class="spacer"></div>
    <div class="pill">🐾 已领养 <b id="petCount">0</b></div>
    <div class="pill">📍 <b id="locName">定位中…</b></div>
  </div>
  <div id="map"></div>
  <div id="dock">
    <div class="dock-btn primary" id="btnRefresh"><span class="ico">🔄</span>巡逻刷新</div>
    <div class="dock-btn" id="btnLocate"><span class="ico">🎯</span>回到我</div>
    <div class="dock-btn" id="btnBook"><span class="ico">📖</span>我的猫窝</div>
  </div>
</div>

<!-- 开场 -->
<div id="intro">
  <div class="logo">🐱</div>
  <h1>喵游记 · Cat Go</h1>
  <p>用真实定位探索你身边的世界，街角随机出没着性格各异的野猫。投喂、调戏、拍照，攻略它们的心，把心动的猫咪领养回家。</p>
  <button class="cta" id="startBtn">开启定位，出门撸猫</button>
  <div class="pill hint">需要授权位置权限 · 拒绝则用默认城市演示</div>
</div>

<!-- 猫咪详情 -->
<div class="sheet-mask" id="catSheet">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="cat-hero">
      <div class="cat-emoji" id="cEmoji">🐱</div>
      <div>
        <h2 id="cName">小猫</h2>
        <div id="cTags"></div>
      </div>
    </div>
    <div class="stat"><div class="lbl"><span>好感度</span><span id="cAffV">0%</span></div><div class="bar affection"><i id="cAff"></i></div></div>
    <div class="stat"><div class="lbl"><span>心情</span><span id="cMoodV">0%</span></div><div class="bar mood"><i id="cMood"></i></div></div>
    <div class="stat"><div class="lbl"><span>警惕值（越低越好领养）</span><span id="cAlertV">0%</span></div><div class="bar alert"><i id="cAlert"></i></div></div>

    <div class="hint-chip" id="cHint">💡 线索加载中…</div>
    <div class="speech" id="cSpeech"><span class="react">💭</span><span id="cSpeechT">它正在打量你…</span></div>

    <div class="actions">
      <div class="act" data-act="feed">🍗 投喂</div>
      <div class="act" data-act="tease">🪶 逗它</div>
      <div class="act" data-act="photo">📷 拍照</div>
      <div class="act" data-act="pet">🤚 撸一撸</div>
      <button class="act adopt" data-act="adopt" id="adoptBtn">🏠 领养（好感≥80 且 警惕≤30）</button>
    </div>
  </div>
</div>

<!-- 道具选择器 -->
<div class="sheet-mask" id="pickerSheet">
  <div class="sheet">
    <div class="grabber"></div>
    <h2 id="pkTitle">选择道具</h2>
    <div class="muted" id="pkTip">选对道具才能事半功倍～</div>
    <div class="picker-list" id="pkList"></div>
  </div>
</div>

<!-- 图鉴/猫窝 -->
<div class="sheet-mask" id="bookSheet">
  <div class="sheet">
    <div class="grabber"></div>
    <h2>我的猫窝</h2>
    <div class="muted">已领养的猫咪会永久保存在本机</div>
    <div class="grid" id="petGrid"></div>
    <div class="sec-title">🎒 我的背包</div>
    <div class="bag" id="bagGrid"></div>
  </div>
</div>

<!-- 拍照结果 -->
<div class="sheet-mask" id="photoSheet">
  <div class="sheet" style="max-width:360px;">
    <div class="grabber"></div>
    <div class="photo-card">
      <div class="frame" id="phEmoji">🐱</div>
      <div class="cap" id="phCap">街角的小猫</div>
      <div class="sub" id="phSub">2026 · 拍摄于附近</div>
    </div>
    <button class="cta" style="width:100%;margin-top:16px;" id="phClose">收进相册</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ 数据定义 ============ */
const BREEDS = [
  {key:'orange', name:'橘猫',  emoji:'🐱', rare:1, weight:22},
  {key:'tabby',  name:'狸花',  emoji:'🐈', rare:1, weight:20},
  {key:'cow',    name:'奶牛猫',emoji:'🐈‍⬛',rare:1, weight:16},
  {key:'calico', name:'三花',  emoji:'🐱', rare:2, weight:14},
  {key:'black',  name:'黑猫',  emoji:'🐈‍⬛',rare:2, weight:12},
  {key:'white',  name:'奶白猫',emoji:'🐈', rare:2, weight:9},
  {key:'ragdoll',name:'布偶',  emoji:'😻', rare:3, weight:5},
  {key:'sphinx', name:'无毛猫',emoji:'🐾', rare:3, weight:2},
];
const PERSONAS = {
  '傲娇':{feed:[-5,15],tease:[-15,5],pet:[-10,12],alert:1.1,quip:['哼，谁要你喂…（偷偷吃）','别以为喂点东西我就会跟你走','……就吃这一口。']},
  '粘人':{feed:[8,18],tease:[-2,12],pet:[10,20],alert:.7,quip:['喵～再多陪我一会嘛','你身上好香，抱抱？','别走别走！']},
  '胆小':{feed:[5,12],tease:[-20,-2],pet:[-6,8],alert:1.4,quip:['你…你别过来！','（缩成一团）','唔…有点怕怕的。']},
  '贪吃':{feed:[14,26],tease:[-4,8],pet:[2,10],alert:.8,quip:['还有吗还有吗！','为了小鱼干我可以！','喵呜——（狼吞虎咽）']},
  '暴躁':{feed:[-2,12],tease:[-22,-4],pet:[-14,6],alert:1.2,quip:['哈！（炸毛）','再戳一下试试？','离朕远点。']},
  '慵懒':{feed:[4,12],tease:[-6,4],pet:[6,14],alert:.9,quip:['呼……（眯眼）','困了，别吵。','摸两下还行，多了不行。']},
  '好奇':{feed:[6,14],tease:[6,18],pet:[4,14],alert:1.0,quip:['这是什么这是什么？','再逗逗我嘛！','你的手好好玩～']},
};
const PERSONA_KEYS = Object.keys(PERSONAS);
const NAMES = ['布丁','可乐','奥利奥','团子','花卷','麻薯','大橘','咪咪','煤球','雪球','糯米','三斤','土豆','芝麻','虎子','汤圆','拿铁','曲奇'];

/* ============ 道具系统 ============
   aff:好感基础区间  mood:心情  alertDown:降低警惕(正数=降)
   loves:遇到这些性格效果翻倍且更亲近   hates:遇到这些性格会反效果/炸毛
*/
const ITEMS = {
  // —— 食物（投喂）——
  dryfish:{name:'小鱼干', emoji:'🐟', type:'food', aff:[6,11],  mood:4,  alertDown:6,  loves:['贪吃'],            hates:[],            desc:'最朴实的诚意'},
  can:    {name:'猫罐头', emoji:'🥫', type:'food', aff:[9,15],  mood:5,  alertDown:8,  loves:['贪吃','粘人'],     hates:[],            desc:'肉香四溢，谁都爱'},
  freeze: {name:'冻干',   emoji:'🍤', type:'food', aff:[8,13],  mood:4,  alertDown:12, loves:['傲娇','慵懒'],     hates:[],            desc:'高级货，挑嘴的也买账'},
  catnip: {name:'猫薄荷', emoji:'🌿', type:'food', aff:[4,8],   mood:14, alertDown:18, loves:['胆小','暴躁','慵懒'], hates:[],         desc:'放松神器，大幅降警惕'},
  grill:  {name:'烤鱼',   emoji:'🍢', type:'food', aff:[14,20], mood:8,  alertDown:10, loves:['傲娇','贪吃','粘人','好奇','胆小','暴躁','慵懒'], hates:[], desc:'稀有大餐，没有猫能拒绝', rare:true},
  // —— 玩具（逗它）——
  wand:   {name:'逗猫棒', emoji:'🪶', type:'toy',  aff:[6,12],  mood:12, alertDown:2,  loves:['好奇','粘人'],     hates:['暴躁','胆小'], desc:'活泼猫的最爱，胆小/暴躁慎用'},
  laser:  {name:'激光笔', emoji:'🔴', type:'toy',  aff:[8,13],  mood:14, alertDown:0,  loves:['好奇','贪吃'],     hates:['慵懒'],        desc:'刺激，懒猫懒得理你'},
  yarn:   {name:'毛线球', emoji:'🧶', type:'toy',  aff:[5,10],  mood:10, alertDown:4,  loves:['好奇','粘人','慵懒'], hates:[],          desc:'温和安全，老少咸宜'},
  box:    {name:'纸箱',   emoji:'📦', type:'toy',  aff:[5,9],   mood:10, alertDown:16, loves:['暴躁','胆小','慵懒'], hates:[],          desc:'安全屋！能安抚警惕的猫'},
};
const START_BAG = {dryfish:5, can:2, freeze:1, catnip:2, grill:0, wand:3, laser:1, yarn:2, box:1};

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
function weighted(list){let t=list.reduce((s,x)=>s+x.weight,0),r=Math.random()*t;for(const x of list){if((r-=x.weight)<0)return x;}return list[0];}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

/* ============ 状态 ============ */
let map, meMarker, myPos=null, cats=[], activeCat=null;
let pets = load('catgo_pets', []);
let bag = load('catgo_bag', null) || {...START_BAG};
$('#petCount').textContent = pets.length;
function saveBag(){save('catgo_bag',bag);}
function affinity(item,persona){return item.loves.includes(persona)?'love':(item.hates.includes(persona)?'hate':'mid');}

/* ============ 生成野猫 ============ */
function makeCat(lat,lng){
  const breed=weighted(BREEDS);
  const persona=pick(PERSONA_KEYS);
  return {
    id:Math.random().toString(36).slice(2),
    name:pick(NAMES), breed, persona,
    lat,lng,
    affection:ri(0,20), mood:ri(35,75), alert:ri(40,90),
    fed:0, // 当次喂食次数防刷
  };
}
function spawnCats(){
  cats.forEach(c=>map.removeLayer(c.marker));
  cats=[];
  if(!myPos)return;
  const n=ri(3,6);
  for(let i=0;i<n;i++){
    // 在 ~300m 范围内随机
    const dLat=rnd(-0.0028,0.0028), dLng=rnd(-0.0028,0.0028);
    const c=makeCat(myPos.lat+dLat, myPos.lng+dLng);
    const icon=L.divIcon({className:'',html:`<div class="cat-marker">${c.breed.emoji}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
    c.marker=L.marker([c.lat,c.lng],{icon}).addTo(map);
    c.marker.on('click',()=>openCat(c));
    cats.push(c);
  }
  // 巡逻补给：基础口粮 + 随机道具，偶尔掉稀有烤鱼
  bag.dryfish=(bag.dryfish||0)+2;
  const drop=pick(['can','catnip','wand','yarn','box','laser','freeze']);
  bag[drop]=(bag[drop]||0)+1;
  let supplyMsg=`补给：🐟小鱼干×2、${ITEMS[drop].emoji}${ITEMS[drop].name}×1`;
  if(Math.random()<0.15){ bag.grill=(bag.grill||0)+1; supplyMsg+='、🍢烤鱼×1'; }
  saveBag();
  toast(`出现 ${n} 只野猫！${supplyMsg}`);
}

/* ============ 互动 ============ */
// 使用道具（投喂/逗它）
function useItem(c,key){
  if((bag[key]||0)<=0){toast('这个道具用完了～');return;}
  bag[key]--; saveBag();
  const item=ITEMS[key];
  const aff=affinity(item,c.persona);
  c.fed=(c.fed||0)+1;
  const ditch=c.fed>3?.5:1; // 反复同一只边际递减
  let dAff,dAlert,dMood,emo,msg;
  if(aff==='love'){
    dAff=ri(...item.aff)*1.6*ditch; dAlert=-(item.alertDown+8); dMood=item.mood+6;
    emo='😻'; msg=`正中下心！${c.name}超喜欢${item.name}。`;
  }else if(aff==='hate'){
    dAff=-ri(...item.aff)*0.6; dAlert=item.type==='toy'?ri(10,16):ri(2,6); dMood=-ri(6,12);
    emo=item.type==='toy'?'🙀':'😾';
    msg=item.type==='toy'?`${c.name}被吓得炸毛了！这玩具不适合它。`:`${c.name}对${item.name}不屑一顾。`;
  }else{
    dAff=ri(...item.aff)*ditch; dAlert=-item.alertDown; dMood=item.mood;
    emo=dAff>8?'😸':'😺'; msg=pick(PERSONAS[c.persona].quip);
  }
  applyDelta(c,dAff,dAlert,dMood,emo,msg);
}
// 撸一撸（免费动作，警惕高时失败）
function petCat(c){
  const p=PERSONAS[c.persona];
  let dAff,dAlert,dMood,emo,msg;
  if(c.alert>=60){dAff=-ri(3,8);dAlert=ri(4,10);dMood=-ri(2,6);emo='🙀';msg='它还很警惕，不让你碰。先用食物或纸箱安抚下吧。';}
  else{dAff=ri(...p.pet);dAlert=-ri(2,8);dMood=ri(4,12);emo=dAff>6?'😽':'😺';msg=pick(p.quip);}
  applyDelta(c,dAff,dAlert,dMood,emo,msg);
}
function applyDelta(c,dAff,dAlert,dMood,emo,msg){
  c.affection=clamp(c.affection+dAff);
  c.alert=clamp(c.alert+dAlert);
  c.mood=clamp(c.mood+dMood);
  if(c.alert>=98 && (c.persona==='胆小'||dAff<0)){ runAway(c); return; }
  $('#cSpeech').querySelector('.react').textContent=emo;
  $('#cSpeechT').textContent=msg + (dAff?`（好感${dAff>0?'+':''}${Math.round(dAff)}）`:'');
  renderCat(c);
}
function runAway(c){
  toast(`${c.name} 受惊跑掉了…💨`);
  map.removeLayer(c.marker); cats=cats.filter(x=>x!==c);
  closeSheet('#catSheet');
}

/* ============ 渲染详情 ============ */
function openCat(c){
  activeCat=c;
  $('#cEmoji').textContent=c.breed.emoji;
  $('#cName').textContent=c.name;
  const rareTxt=['','普通','少见','稀有'][c.breed.rare];
  $('#cTags').innerHTML=
    `<span class="tag ${c.breed.rare>=3?'rare':''}">${c.breed.name}</span>`+
    `<span class="tag">${c.persona}</span>`+
    `<span class="tag ${c.breed.rare>=3?'rare':''}">★ ${rareTxt}</span>`;
  // 喜好线索：列出该性格喜欢的道具
  const liked=Object.values(ITEMS).filter(it=>it.loves.includes(c.persona)&&!it.rare).map(it=>it.emoji+it.name);
  const hated=Object.values(ITEMS).filter(it=>it.hates.includes(c.persona)).map(it=>it.name);
  let hint=`「${c.persona}」似乎偏爱 ${liked.slice(0,3).join('、')||'食物'}`;
  if(hated.length) hint+=`，讨厌 ${hated.join('、')}`;
  $('#cHint').textContent='💡 '+hint;
  $('#cSpeech').querySelector('.react').textContent='💭';
  $('#cSpeechT').textContent='它正在打量你…';
  renderCat(c);
  openSheet('#catSheet');
}
/* ============ 道具选择器 ============ */
function openPicker(type){
  const c=activeCat; if(!c)return;
  $('#pkTitle').textContent=type==='food'?'🍗 选一样投喂':'🪶 选一个玩具逗它';
  $('#pkTip').textContent='标 想要 的道具效果翻倍并降警惕；标 讨厌 的会适得其反。';
  const list=Object.entries(ITEMS).filter(([k,it])=>it.type===type);
  $('#pkList').innerHTML=list.map(([k,it])=>{
    const cnt=bag[k]||0;
    const aff=affinity(it,c.persona);
    const badge=aff==='love'?'<span class="aff-badge aff-love">想要</span>'
      :aff==='hate'?'<span class="aff-badge aff-hate">讨厌</span>'
      :'<span class="aff-badge aff-mid">一般</span>';
    return `<div class="item-row ${cnt<=0?'disabled':''}" data-key="${k}">
      <div class="ie">${it.emoji}</div>
      <div class="info"><div class="iname">${it.name}${badge}</div><div class="idesc">${it.desc}</div></div>
      <div class="cnt">×${cnt}</div></div>`;
  }).join('');
  $('#pkList').querySelectorAll('.item-row').forEach(r=>r.addEventListener('click',()=>{
    useItem(activeCat, r.dataset.key);
    closeSheet('#pickerSheet');
  }));
  openSheet('#pickerSheet');
}
function renderCat(c){
  $('#cAff').style.width=c.affection+'%'; $('#cAffV').textContent=Math.round(c.affection)+'%';
  $('#cMood').style.width=c.mood+'%';     $('#cMoodV').textContent=Math.round(c.mood)+'%';
  $('#cAlert').style.width=c.alert+'%';   $('#cAlertV').textContent=Math.round(c.alert)+'%';
  const can=c.affection>=80 && c.alert<=30;
  $('#adoptBtn').disabled=!can;
  $('#adoptBtn').textContent=can?'🏠 领养它回家！':'🏠 领养（好感≥80 且 警惕≤30）';
}

/* ============ 拍照 ============ */
function takePhoto(c){
  $('#phEmoji').textContent=c.breed.emoji;
  $('#phCap').textContent=`${c.name} · ${c.persona}的${c.breed.name}`;
  $('#phSub').textContent=`2026 · 拍摄于 ${$('#locName').textContent}`;
  openSheet('#photoSheet');
}

/* ============ 领养 ============ */
function adopt(c){
  const pet={id:c.id,name:c.name,emoji:c.breed.emoji,breed:c.breed.name,persona:c.persona,rare:c.breed.rare,date:'2026-06-25'};
  pets.unshift(pet); save('catgo_pets',pets);
  $('#petCount').textContent=pets.length;
  map.removeLayer(c.marker); cats=cats.filter(x=>x!==c);
  closeSheet('#catSheet');
  toast(`🎉 你领养了 ${c.name}！欢迎回家～`);
}

/* ============ 猫窝 ============ */
function renderBook(){
  const g=$('#petGrid');
  if(!pets.length){g.innerHTML='<div class="empty" style="grid-column:1/4">还没有领养任何猫咪<br>出门去攻略一只吧～</div>';return;}
  g.innerHTML=pets.map(p=>`<div class="pet"><div class="e">${p.emoji}</div><div class="n">${p.name}</div><div class="p">${p.persona}·${p.breed}</div></div>`).join('');
}
function renderBag(){
  $('#bagGrid').innerHTML=Object.entries(ITEMS).map(([k,it])=>{
    const cnt=bag[k]||0;
    return `<div class="slot" style="${cnt<=0?'opacity:.4':''}"><div class="bc">${cnt}</div><div class="be">${it.emoji}</div><div class="bn">${it.name}</div></div>`;
  }).join('');
}

/* ============ 弹层控制 ============ */
function openSheet(s){$(s).classList.add('show');}
function closeSheet(s){$(s).classList.remove('show');}
document.querySelectorAll('.sheet-mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));

/* ============ 详情按钮 ============ */
document.querySelectorAll('#catSheet .act').forEach(b=>b.addEventListener('click',()=>{
  if(!activeCat)return; const act=b.dataset.act;
  if(act==='adopt'){ if(activeCat.affection>=80&&activeCat.alert<=30) adopt(activeCat); return; }
  if(act==='photo'){ takePhoto(activeCat); return; }
  if(act==='feed'){ openPicker('food'); return; }
  if(act==='tease'){ openPicker('toy'); return; }
  if(act==='pet'){ petCat(activeCat); return; }
}));

/* ============ 底部栏 ============ */
$('#btnRefresh').addEventListener('click',spawnCats);
$('#btnLocate').addEventListener('click',()=>{if(myPos)map.setView([myPos.lat,myPos.lng],17);});
$('#btnBook').addEventListener('click',()=>{renderBook();renderBag();openSheet('#bookSheet');});
$('#phClose').addEventListener('click',()=>closeSheet('#photoSheet'));

/* ============ 初始化地图 ============ */
function initMap(lat,lng,label){
  myPos={lat,lng};
  $('#locName').textContent=label||'当前位置';
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([lat,lng],17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  const meIcon=L.divIcon({className:'',html:'<div class="me-marker"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  meMarker=L.marker([lat,lng],{icon:meIcon}).addTo(map);
  spawnCats();
}

/* ============ 开始 ============ */
$('#startBtn').addEventListener('click',()=>{
  $('#startBtn').textContent='定位中…';
  const fallback=()=>{ initMap(31.2304,121.4737,'上海(演示)'); $('#intro').style.display='none'; };
  if(!navigator.geolocation){fallback();return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{ initMap(pos.coords.latitude,pos.coords.longitude,'我的位置'); $('#intro').style.display='none'; },
    err=>{ toast('未获得定位权限，使用演示位置'); fallback(); },
    {enableHighAccuracy:true,timeout:8000}
  );
});
</script>
</body>
